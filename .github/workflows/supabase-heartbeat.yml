name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, meio-dia UTC
  workflow_dispatch:          # permite disparo manual pra testar

permissions:
  contents: write            # necessário pro commit automático abaixo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/_heartbeat?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            || (echo "::error::Heartbeat falhou" && exit 1)

      - name: Registrar execução (mantém o repositório "ativo" pro GitHub)
        run: |
          echo "Última execução: $(date -u '+%Y-%m-%d %H:%M UTC')" > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "chore: heartbeat $(date -u '+%Y-%m-%d')" || echo "Nada pra commitar"
          git push
